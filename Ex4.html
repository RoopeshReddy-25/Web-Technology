<Style class="css">
    *{ 
 margin:0; 
 padding:0; 
 box-sizing:border-box; 
 font-family:Arial, Helvetica, sans-serif; } 
body{ 
 background:#f4f4f4; 
} 
/* Header */ 
header{ 
 background:linear-gradient(#1d5db8,#3d86e3);  height:180px; 
 position:relative; 
} 
.logo{ 
 width:90px; 
 margin:20px; 
} 
/* Navigation */ 
nav{ 
 background:#888; 
} 
nav ul{ 
 list-style:none; 
 display:flex; 
} 
nav ul li{ 
 position:relative; } 
nav ul li a{ 
 color:white; 
 text-decoration:none;  display:block; 
 padding:15px 50px; } 
nav ul li:hover{ 
 background:red; } 
/* Dropdown */ 
.dropdown{ 
 display:none; 
 position:absolute;  background:#2c9c2c;  width:180px; 
} 
.dropdown li{ 
 width:100%;
} 
.dropdown li a{ 
 padding:15px; 
 color:white; 
} 
nav ul li:hover .dropdown{ 
 display:block; 
} 
.dropdown li:hover{ 
 background:green; 
} 
/* Form Section */ 
.container{ 
 background:url("https://images.unsplash.com/photo-1519389950473- 47ba0277781c?auto=format&fit=crop&w=1500&q=80");  background-size:cover; 
 background-position:center; 
 display:flex; 
 justify-content:center; 
 gap:50px; 
 padding:80px; 
} 
.box{
 background:white; 
 width:320px; 
 padding:30px; 
 border-radius:15px; 
 box-shadow:0 0 15px rgba(0,0,0,.3); } 
.box h2{ 
 text-align:center; 
 margin-bottom:20px; 
} 
label{ 
 font-weight:bold; 
} 
input[type=text], 
input[type=email], 
input[type=password]{ 
 width:100%; 
 padding:12px; 
 margin-top:8px; 
 margin-bottom:18px; 
 border:1px solid #ccc;
 border-radius:5px; } 
input[type=submit]{  width:100%; 
 padding:12px; 
 border:none; 
 background:#0d6efd;  color:white; 
 font-size:16px; 
 border-radius:5px;  cursor:pointer; 
} 
input[type=submit]:hover{  background:#004ecb; } 
/* Footer */ 
footer{ 
 background:#f7deb4;  text-align:center; 
 padding:20px; 
 font-size:18px;
}
</Style>
